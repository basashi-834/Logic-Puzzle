<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>論理回路パズル ― 論理演算をドラッグ＆ドロップで学ぶ</title>
<meta name="description" content="AND / OR / NOT / NAND / NOR / EX-OR / EX-NOR を実際につないで動かし、真理値表とベン図がその場で変化する論理回路の学習パズル。">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23123a63'/><path d='M14 16h14a16 16 0 0 1 0 32H14z' fill='none' stroke='%23ffe12e' stroke-width='5'/></svg>">
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 48 48"><path d="M8 10h14a14 14 0 0 1 0 28H8z" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="41" cy="24" r="4" fill="none" stroke="currentColor" stroke-width="4"/></svg>
    </span>
    <span class="brand-text">
      <b>論理回路パズル</b>
      <small>論理演算をドラッグ＆ドロップで学ぶ</small>
    </span>
  </div>

  <nav class="tabs" aria-label="モード切り替え">
    <button class="tab active" data-view="puzzle">🧩 パズル</button>
    <button class="tab" data-view="sandbox">🛠 じゆう工作</button>
    <button class="tab" data-view="ref">📖 早見表</button>
    <button class="tab" data-view="quiz">❓ クイズ</button>
  </nav>

  <div class="header-right">
    <div class="seg" id="notation" title="回路記号の流派を切り替えます">
      <span class="seg-label">記号</span>
      <button data-n="MIL" class="on">MIL</button><button data-n="JIS">JIS</button>
    </div>
    <button class="btn ghost" id="helpBtn">遊び方</button>
  </div>
</header>

<main>
  <!-- ============ パズルモード ============ -->
  <section class="view workspace" id="view-puzzle">
    <aside class="col-left">
      <div class="card">
        <h3>部品パレット</h3>
        <div class="palette" id="pzPalette"></div>
        <p class="pal-tip"><b>置く</b>：盤面へドラッグ（タップでも可）<br><b>つなぐ</b>：端子をタップ → つなぎ先をタップ<br><b>消す</b>：線や部品をタップ → ✕ をタップ</p>
      </div>
      <div class="card">
        <h3>そうさ</h3>
        <div class="ops">
          <button class="btn ghost small" id="pzDelete">選んだ部品／線を削除</button>
          <button class="btn ghost small" id="pzClear">ゲートを全部消す</button>
        </div>
        <div class="progress">
          <div class="progress-head"><span>進み具合</span><span id="progressText">0 / 18 クリア</span></div>
          <div class="progress-bar"><i id="progressBar"></i></div>
        </div>
      </div>
    </aside>

    <div class="col-center">
      <div class="board-head">
        <button class="nav-btn" id="pzPrev" title="前のステージ">◀</button>
        <div class="stage-title">
          <span class="chapter" id="pzChapter"></span>
          <h2 id="pzTitle"></h2>
        </div>
        <button class="nav-btn" id="pzNext" title="次のステージ">▶</button>
        <button class="btn ghost small" id="pzListBtn">ステージ一覧</button>
      </div>
      <div class="board-wrap"><svg id="pzBoard" class="board"></svg></div>
      <div class="board-foot" id="pzMsg"></div>
    </div>

    <aside class="col-right">
      <div class="card">
        <h3>目標</h3>
        <div id="pzTargetBody"></div>
      </div>
      <div class="card" id="pzTable"></div>
    </aside>
  </section>

  <!-- ============ じゆう工作モード ============ -->
  <section class="view workspace" id="view-sandbox" hidden>
    <aside class="col-left">
      <div class="card">
        <h3>部品パレット</h3>
        <div class="palette" id="sbPalette"></div>
        <p class="pal-tip"><b>置く</b>：盤面へドラッグ（タップでも可）<br><b>つなぐ</b>：端子をタップ → つなぎ先をタップ<br><b>消す</b>：線や部品をタップ → ✕ をタップ</p>
      </div>
      <div class="card">
        <h3>そうさ</h3>
        <div class="ops">
          <button class="btn ghost small" id="sbDelete">選んだ部品／線を削除</button>
          <button class="btn ghost small" id="sbClear">まっさらにする</button>
          <button class="btn ghost small" id="sbReset">お手本（AND）に戻す</button>
        </div>
        <p class="pal-tip" id="sbMsg"></p>
      </div>
    </aside>

    <div class="col-center">
      <div class="board-head">
        <div class="stage-title">
          <span class="chapter">サンドボックス</span>
          <h2>じゆうに回路を組んでみよう</h2>
        </div>
      </div>
      <div class="board-wrap"><svg id="sbBoard" class="board"></svg></div>
      <div class="board-foot" id="sbFoot">
        <span class="msg">入力スイッチ・出力ランプも自由に増やせます（入力は最大 5 個、ベン図は 3 個まで）。</span>
      </div>
    </div>

    <aside class="col-right">
      <div class="card" id="sbTable"></div>
      <div class="card" id="sbVenn"></div>
      <div class="card" id="sbExpr"></div>
    </aside>
  </section>

  <!-- ============ 早見表 ============ -->
  <section class="view page" id="view-ref" hidden></section>

  <!-- ============ クイズ ============ -->
  <section class="view page" id="view-quiz" hidden></section>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true">
    <button class="modal-close" id="modalClose" aria-label="とじる">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="js/gates.js"></script>
<script src="js/symbols.js"></script>
<script src="js/circuit.js"></script>
<script src="js/tables.js"></script>
<script src="js/venn.js"></script>
<script src="js/board.js"></script>
<script src="js/puzzles.js"></script>
<script src="js/reference.js"></script>
<script src="js/quiz.js"></script>
<script src="js/app.js"></script>
</body>
</html>
